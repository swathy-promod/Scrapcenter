{% extends 'Guest/mid.html' %}
{% block content %}
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{ margin:0; padding:0; box-sizing:border-box; }

body{
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#020617,#0f172a,#111827);
    overflow-x: hidden;
    color: white;
}

.cp-section{
    min-height: 88vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 15px;
    position: relative;
    overflow: hidden;
}

.cp-section::before{
    content: "";
    position: absolute;
    width: 420px; height: 420px;
    background: rgba(37,99,235,0.35);
    border-radius: 50%;
    top: -120px; left: -120px;
    filter: blur(120px);
}

.cp-section::after{
    content: "";
    position: absolute;
    width: 350px; height: 350px;
    background: rgba(168,85,247,0.28);
    border-radius: 50%;
    bottom: -100px; right: -100px;
    filter: blur(120px);
}

.cp-card{
    width: 100%;
    max-width: 450px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(16px);
    border-radius: 26px;
    padding: 45px 38px;
    position: relative;
    z-index: 1;
    box-shadow: 0 20px 45px rgba(0,0,0,0.4);
    animation: fadeIn 0.7s ease;
}

@keyframes fadeIn{
    from{ opacity:0; transform:translateY(25px); }
    to{ opacity:1; transform:translateY(0); }
}

.cp-icon{
    width: 68px; height: 68px;
    border-radius: 50%;
    background: linear-gradient(135deg,#2563eb,#3b82f6);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 28px;
    box-shadow: 0 8px 20px rgba(59,130,246,0.35);
}

.cp-title{
    text-align: center;
    margin-bottom: 32px;
}

.cp-title h2{ font-size: 32px; font-weight: 700; margin-bottom: 6px; }
.cp-title p{ color: rgba(255,255,255,0.65); font-size: 14px; }

.form-group{
    margin-bottom: 20px;
    position: relative;
}

.form-group label{
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
}

.form-group label i{ margin-right: 7px; font-size: 15px; color: #60a5fa; }

.form-control{
    width: 100%;
    height: 52px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.05);
    color: #fff;
    padding: 0 48px 0 16px;
    font-size: 14px;
    font-family: 'Poppins', sans-serif;
    transition: all 0.3s ease;
}

.form-control::placeholder{ color: rgba(255,255,255,0.4); }

.form-control:focus{
    outline: none;
    border-color: #3b82f6;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 18px rgba(59,130,246,0.3);
}

.toggle-eye{
    position: absolute;
    right: 14px;
    top: 38px;
    cursor: pointer;
    color: rgba(255,255,255,0.45);
    font-size: 18px;
    transition: color 0.2s;
}

.toggle-eye:hover{ color: #60a5fa; }

.hint{
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-top: 6px;
}

.divider{
    border: none;
    border-top: 1px solid rgba(255,255,255,0.08);
    margin: 24px 0;
}

.btn-row{
    display: flex;
    gap: 12px;
    margin-top: 8px;
}

.btn-save{
    flex: 1;
    height: 52px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg,#2563eb,#3b82f6);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-save:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 24px rgba(37,99,235,0.45);
}

.btn-reset{
    flex: 1;
    height: 52px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.8);
    font-size: 15px;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-reset:hover{
    background: rgba(255,255,255,0.10);
    transform: translateY(-3px);
}

@media(max-width:576px){
    .cp-card{ padding: 35px 22px; }
    .cp-title h2{ font-size: 26px; }
}
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<section class="cp-section">
    <div class="cp-card">

        <div class="cp-title">
            <div class="cp-icon">
                <i class="ti ti-lock" style="color:#fff; font-size:28px;"></i>
            </div>
            <h2>Change Password</h2>
            <p>Keep your account secure</p>
        </div>

        <form method="post" action="">
            {% csrf_token %}

            <!-- OLD PASSWORD -->
            <div class="form-group">
                <label><i class="ti ti-lock"></i>Old Password</label>
                <input type="password" id="old_pw" class="form-control"
                       name="txt_password"
                       pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                       title="Must contain at least one number, one uppercase and lowercase letter, and at least 8 characters"
                       placeholder="Enter old password" required>
                <i class="ti ti-eye toggle-eye" onclick="togglePw('old_pw', this)"></i>
            </div>

            <!-- NEW PASSWORD -->
            <div class="form-group">
                <label><i class="ti ti-lock-plus"></i>New Password</label>
                <input type="password" id="new_pw" class="form-control"
                       name="txt_newpassword"
                       pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                       title="Must contain at least one number, one uppercase and lowercase letter, and at least 8 characters"
                       placeholder="Enter new password" required>
                <i class="ti ti-eye toggle-eye" onclick="togglePw('new_pw', this)"></i>
                <p class="hint">Min 8 characters with uppercase, lowercase and a number</p>
            </div>

            <!-- RETYPE PASSWORD -->
            <div class="form-group">
                <label><i class="ti ti-lock-check"></i>Retype New Password</label>
                <input type="password" id="retype_pw" class="form-control"
                       name="txt_retypepassword"
                       placeholder="Retype new password" required>
                <i class="ti ti-eye toggle-eye" onclick="togglePw('retype_pw', this)"></i>
            </div>

            <hr class="divider">

            <div class="btn-row">
                <button type="submit" name="btn_submit" class="btn-save">
                    <i class="ti ti-device-floppy"></i> Save
                </button>
                <button type="reset" name="btn_reset" class="btn-reset">
                    <i class="ti ti-refresh"></i> Reset
                </button>
            </div>

        </form>
    </div>
</section>

{% if msg %}
<script>
    alert("{{ msg }}");
    window.location = "{% url 'Scrapcenter:MyProfile' %}";
</script>
{% endif %}

<script>
function togglePw(id, icon) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('ti-eye', 'ti-eye-off');
    } else {
        input.type = 'password';
        icon.classList.replace('ti-eye-off', 'ti-eye');
    }
}
</script>

{% endblock content %}

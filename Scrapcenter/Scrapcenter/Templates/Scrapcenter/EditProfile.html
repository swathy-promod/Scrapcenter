{% extends 'Guest/mid.html' %}
{% block content %}
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
@import url('https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css');

*{ margin:0; padding:0; box-sizing:border-box; }

body{
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#020617,#0f172a,#111827);
    overflow-x: hidden;
    color: white;
}

.ep-section{
    min-height: 88vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 15px;
    position: relative;
    overflow: hidden;
}

.ep-section::before{
    content: "";
    position: absolute;
    width: 420px; height: 420px;
    background: rgba(37,99,235,0.35);
    border-radius: 50%;
    top: -120px; left: -120px;
    filter: blur(120px);
}

.ep-section::after{
    content: "";
    position: absolute;
    width: 350px; height: 350px;
    background: rgba(168,85,247,0.28);
    border-radius: 50%;
    bottom: -100px; right: -100px;
    filter: blur(120px);
}

.ep-card{
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(16px);
    border-radius: 26px;
    padding: 45px 38px;
    position: relative;
    z-index: 1;
    box-shadow: 0 20px 45px rgba(0,0,0,0.4);
    animation: fadeIn 0.7s ease;
}

@keyframes fadeIn{
    from{ opacity:0; transform:translateY(25px); }
    to{ opacity:1; transform:translateY(0); }
}

.ep-avatar{
    width: 72px; height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg,#2563eb,#3b82f6);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 8px 20px rgba(59,130,246,0.35);
}

.ep-title{
    text-align: center;
    margin-bottom: 32px;
}

.ep-title h2{ font-size: 32px; font-weight: 700; margin-bottom: 6px; }
.ep-title p{ color: rgba(255,255,255,0.65); font-size: 14px; }

.form-group{ margin-bottom: 20px; }

.form-group label{
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
}

.form-group label i{ margin-right: 7px; font-size: 15px; color: #60a5fa; }

.form-control{
    width: 100%;
    height: 52px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.05);
    color: #fff;
    padding: 0 16px;
    font-size: 14px;
    font-family: 'Poppins', sans-serif;
    transition: all 0.3s ease;
}

.form-control::placeholder{ color: rgba(255,255,255,0.4); }

.form-control:focus{
    outline: none;
    border-color: #3b82f6;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 18px rgba(59,130,246,0.3);
}

textarea.form-control{
    height: 90px;
    padding: 12px 16px;
    resize: vertical;
}

.divider{
    border: none;
    border-top: 1px solid rgba(255,255,255,0.08);
    margin: 24px 0;
}

.btn-save{
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg,#2563eb,#3b82f6);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-save:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 24px rgba(37,99,235,0.45);
}

@media(max-width:576px){
    .ep-card{ padding: 35px 22px; }
    .ep-title h2{ font-size: 26px; }
}
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<section class="ep-section">
    <div class="ep-card">

        <div class="ep-title">
            <div class="ep-avatar">
                {{ data.scrapcenterreg_name|first|upper }}
            </div>
            <h2>Edit Profile</h2>
            <p>Update your account information</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label><i class="ti ti-user"></i>Full Name</label>
                <input type="text" class="form-control"
                       name="txtname"
                       value="{{ data.scrapcenterreg_name }}"
                       pattern="^[A-Z]+[a-zA-Z ]*$"
                       title="First letter must be capital. Only alphabets and spaces allowed."
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label><i class="ti ti-mail"></i>Email Address</label>
                <input type="email" class="form-control"
                       name="txtemail"
                       value="{{ data.scrapcenterreg_email }}"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label><i class="ti ti-phone"></i>Contact Number</label>
                <input type="number" class="form-control"
                       name="num_number"
                       value="{{ data.scrapcenterreg_contact }}"
                       placeholder="Enter your contact number" required>
            </div>

            <div class="form-group">
                <label><i class="ti ti-map-pin"></i>Address</label>
                <textarea class="form-control" name="txtaddress"
                          placeholder="Enter your address" required>{{ data.scrapcenterreg_address }}</textarea>
            </div>

            <hr class="divider">

            <button type="submit" class="btn-save">
                <i class="ti ti-device-floppy"></i>
                Save Changes
            </button>

        </form>
    </div>
</section>

{% endblock content %}

{% extends 'Guest/nav.html' %}
{% load static %}

{% block content %}

<style>

@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

.edit-section{
    min-height:100vh;
    padding:50px 20px;
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Sora',sans-serif;
}

.edit-section::before{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    background:rgba(59,130,246,.15);
    border-radius:50%;
    top:-150px;
    left:-150px;
    filter:blur(100px);
}

.edit-section::after{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    background:rgba(147,51,234,.15);
    border-radius:50%;
    bottom:-150px;
    right:-150px;
    filter:blur(100px);
}

.blob-mid{
    position:absolute;
    width:300px;
    height:300px;
    background:rgba(59,130,246,.08);
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    filter:blur(80px);
    pointer-events:none;
}

/* CARD */
.edit-card{
    position:relative;
    z-index:10;
    width:100%;
    max-width:520px;
    background:rgba(255,255,255,.07);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,.10);
    border-radius:32px;
    padding:48px 40px 40px;
    box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
    animation:slideUp .5s cubic-bezier(.22,1,.36,1) both;
}

@keyframes slideUp{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;transform:translateY(0);}
}

/* icon lockup */
.edit-icon-wrap{
    width:72px;
    height:72px;
    border-radius:22px;
    background:linear-gradient(135deg,#2563eb,#9333ea);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 28px;
    box-shadow:0 8px 24px rgba(99,102,241,.4);
}

.edit-icon-wrap svg{
    width:36px;
    height:36px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.edit-title{
    text-align:center;
    color:#fff;
    font-size:26px;
    font-weight:700;
    letter-spacing:-.5px;
    margin-bottom:6px;
}

.edit-subtitle{
    text-align:center;
    color:#94a3b8;
    font-size:14px;
    margin-bottom:36px;
    line-height:1.6;
}

/* FIELD */
.field{
    margin-bottom:22px;
    animation:slideUp .5s cubic-bezier(.22,1,.36,1) both;
}

.field:nth-child(1){ animation-delay:.05s; }
.field:nth-child(2){ animation-delay:.10s; }
.field:nth-child(3){ animation-delay:.15s; }
.field:nth-child(4){ animation-delay:.20s; }

.field label{
    display:block;
    color:#94a3b8;
    font-size:12px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:10px;
    font-family:'JetBrains Mono',monospace;
}

.input-wrap{
    position:relative;
}

.input-wrap .field-icon{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    stroke:#64748b;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    pointer-events:none;
    transition:stroke .25s;
}

.input-wrap input,
.input-wrap textarea{
    width:100%;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);
    border-radius:14px;
    padding:15px 18px 15px 46px;
    color:#fff;
    font-size:15px;
    font-family:'Sora',sans-serif;
    outline:none;
    transition:border-color .25s, background .25s, box-shadow .25s;
    -moz-appearance:textfield;
}

/* remove number spinners */
.input-wrap input[type=number]::-webkit-outer-spin-button,
.input-wrap input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
}

.input-wrap textarea{
    resize:vertical;
    min-height:100px;
    padding-top:14px;
    line-height:1.6;
}

.textarea-wrap .field-icon{
    top:18px;
    transform:none;
}

.input-wrap input::placeholder,
.input-wrap textarea::placeholder{
    color:rgba(148,163,184,.4);
    font-size:14px;
}

.input-wrap input:focus,
.input-wrap textarea:focus{
    border-color:rgba(96,165,250,.6);
    background:rgba(255,255,255,.10);
    box-shadow:0 0 0 3px rgba(59,130,246,.15);
}

.input-wrap input:focus ~ .field-icon,
.input-wrap textarea:focus ~ .field-icon{
    stroke:#60a5fa;
}

/* focus icon trick — icon before input in DOM, use sibling won't work
   so we flip the order and use CSS */
.input-wrap input:focus + svg,
.input-wrap textarea:focus + svg{ stroke:#60a5fa; }

/* DIVIDER */
.divider{
    height:1px;
    background:rgba(255,255,255,.08);
    margin:28px 0;
}

/* BUTTONS */
.btn-row{
    display:flex;
    gap:14px;
}

.btn{
    flex:1;
    padding:15px 10px;
    border:none;
    border-radius:14px;
    font-family:'Sora',sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:transform .25s, box-shadow .25s;
    letter-spacing:.01em;
    text-align:center;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.btn:hover{ transform:translateY(-3px); }
.btn:active{ transform:translateY(0); }

.btn-save{
    background:linear-gradient(135deg,#2563eb,#9333ea);
    color:#fff;
    box-shadow:0 6px 20px rgba(99,102,241,.35);
}

.btn-save:hover{
    box-shadow:0 10px 28px rgba(99,102,241,.5);
}

.btn-cancel{
    background:rgba(255,255,255,.08);
    color:#94a3b8;
    border:1px solid rgba(255,255,255,.10);
}

.btn-cancel:hover{
    background:rgba(255,255,255,.13);
    color:#cbd5e1;
}

.btn svg{
    width:16px;
    height:16px;
    stroke:currentColor;
    fill:none;
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    flex-shrink:0;
}

/* back link */
.back-link{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#64748b;
    font-size:13px;
    text-decoration:none;
    transition:color .2s;
}

.back-link:hover{ color:#94a3b8; }

/* inline validation hint */
.hint{
    margin-top:6px;
    font-size:11px;
    font-family:'JetBrains Mono',monospace;
    color:#64748b;
    min-height:16px;
    transition:color .3s;
}

/* RESPONSIVE */
@media(max-width:560px){
    .edit-card{ padding:36px 20px 30px; }
    .edit-title{ font-size:22px; }
    .btn-row{ flex-direction:column; }
}

</style>

<div class="edit-section">

    <div class="blob-mid"></div>

    <div class="edit-card">

        <!-- Icon -->
        <div class="edit-icon-wrap">
            <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </div>

        <h1 class="edit-title">Edit Profile</h1>
        <p class="edit-subtitle">Update your personal details below.<br>Changes are saved immediately.</p>

        <form method="post">
            {% csrf_token %}

            <!-- Name -->
            <div class="field">
                <label for="id_name">Full Name</label>
                <div class="input-wrap">
                    <input
                        type="text"
                        id="id_name"
                        name="txtname"
                        value="{{ data.userregistration_name }}"
                        placeholder="Enter your full name"
                        pattern="^[A-Z]+[a-zA-Z ]*$"
                        title="First letter must be capital; only letters and spaces allowed"
                        required
                        oninput="validateName(this)"
                    >
                    <svg class="field-icon" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <div class="hint" id="name-hint"></div>
            </div>

            <!-- Email -->
            <div class="field">
                <label for="id_email">Email Address</label>
                <div class="input-wrap">
                    <input
                        type="email"
                        id="id_email"
                        name="txtemail"
                        value="{{ data.userregistration_email }}"
                        placeholder="Enter your email"
                        required
                        oninput="validateEmail(this)"
                    >
                    <svg class="field-icon" viewBox="0 0 24 24">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                </div>
                <div class="hint" id="email-hint"></div>
            </div>

            <!-- Contact -->
            <div class="field">
                <label for="id_contact">Contact Number</label>
                <div class="input-wrap">
                    <input
                        type="number"
                        id="id_contact"
                        name="num_number"
                        value="{{ data.userregistration_contact }}"
                        placeholder="10-digit mobile number"
                        required
                        oninput="validateContact(this)"
                    >
                    <svg class="field-icon" viewBox="0 0 24 24">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.6 3.41 2 2 0 0 1 3.57 1.25h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.79a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16z"/>
                    </svg>
                </div>
                <div class="hint" id="contact-hint"></div>
            </div>

            <!-- Address -->
            <div class="field">
                <label for="id_address">Address</label>
                <div class="input-wrap textarea-wrap">
                    <textarea
                        id="id_address"
                        name="txtaddress"
                        placeholder="Enter your address"
                        required
                    >{{ data.userregistration_address }}</textarea>
                    <svg class="field-icon" viewBox="0 0 24 24">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                </div>
            </div>

            <div class="divider"></div>

            <div class="btn-row">
                <a href="{% url 'User:MyProfile' %}" class="btn btn-cancel">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    Cancel
                </a>
                <button type="submit" class="btn btn-save" name="btn_submit">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                    Save Changes
                </button>
            </div>

        </form>

        <a href="{% url 'User:MyProfile' %}" class="back-link">← Back to Profile</a>

    </div>

</div>

{% if msg %}
<script>
    alert("{{ msg }}")
    window.location = "{% url 'User:MyProfile' %}"
</script>
{% endif %}

<script>
function validateName(inp){
    const hint = document.getElementById('name-hint');
    const ok = /^[A-Z][a-zA-Z ]*$/.test(inp.value);
    if(!inp.value){ hint.textContent=''; return; }
    if(ok){
        hint.textContent = '✓ Looks good';
        hint.style.color = '#22c55e';
    } else {
        hint.textContent = 'First letter must be uppercase; only letters and spaces allowed';
        hint.style.color = '#ef4444';
    }
}

function validateEmail(inp){
    const hint = document.getElementById('email-hint');
    const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(inp.value);
    if(!inp.value){ hint.textContent=''; return; }
    if(ok){
        hint.textContent = '✓ Valid email address';
        hint.style.color = '#22c55e';
    } else {
        hint.textContent = 'Enter a valid email address';
        hint.style.color = '#ef4444';
    }
}

function validateContact(inp){
    const hint = document.getElementById('contact-hint');
    const val  = inp.value;
    if(!val){ hint.textContent=''; return; }
    if(/^[7-9][0-9]{9}$/.test(val)){
        hint.textContent = '✓ Valid mobile number';
        hint.style.color = '#22c55e';
    } else {
        hint.textContent = 'Must be 10 digits starting with 7, 8, or 9';
        hint.style.color = '#ef4444';
    }
}
</script>

{% endblock content %}

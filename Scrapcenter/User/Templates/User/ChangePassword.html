{% extends 'Guest/nav.html' %}
{% load static %}

{% block content %}

<style>

@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

.password-section{
    min-height:100vh;
    padding:50px 20px;
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Sora',sans-serif;
}

/* ambient blobs — same as profile page */
.password-section::before{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    background:rgba(59,130,246,.15);
    border-radius:50%;
    top:-150px;
    left:-150px;
    filter:blur(100px);
}

.password-section::after{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    background:rgba(147,51,234,.15);
    border-radius:50%;
    bottom:-150px;
    right:-150px;
    filter:blur(100px);
}

/* extra centre blob for depth */
.blob-mid{
    position:absolute;
    width:300px;
    height:300px;
    background:rgba(59,130,246,.08);
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    filter:blur(80px);
    pointer-events:none;
}

/* CARD */
.pw-card{
    position:relative;
    z-index:10;
    width:100%;
    max-width:480px;
    background:rgba(255,255,255,.07);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,.10);
    border-radius:32px;
    padding:48px 40px 40px;
    box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
    animation:slideUp .5s cubic-bezier(.22,1,.36,1) both;
}

@keyframes slideUp{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;transform:translateY(0);}
}

/* icon lockup */
.pw-icon-wrap{
    width:72px;
    height:72px;
    border-radius:22px;
    background:linear-gradient(135deg,#2563eb,#9333ea);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 28px;
    box-shadow:0 8px 24px rgba(99,102,241,.4);
}

.pw-icon-wrap svg{
    width:36px;
    height:36px;
    color:white;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.pw-title{
    text-align:center;
    color:#fff;
    font-size:26px;
    font-weight:700;
    letter-spacing:-.5px;
    margin-bottom:6px;
}

.pw-subtitle{
    text-align:center;
    color:#94a3b8;
    font-size:14px;
    margin-bottom:36px;
    line-height:1.6;
}

/* FIELD */
.field{
    margin-bottom:22px;
    animation:slideUp .5s cubic-bezier(.22,1,.36,1) both;
}

.field:nth-child(1){ animation-delay:.05s; }
.field:nth-child(2){ animation-delay:.10s; }
.field:nth-child(3){ animation-delay:.15s; }

.field label{
    display:block;
    color:#94a3b8;
    font-size:12px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:10px;
    font-family:'JetBrains Mono',monospace;
}

.input-wrap{
    position:relative;
}

.input-wrap input{
    width:100%;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);
    border-radius:14px;
    padding:15px 50px 15px 18px;
    color:#fff;
    font-size:15px;
    font-family:'Sora',sans-serif;
    outline:none;
    transition:border-color .25s, background .25s, box-shadow .25s;
}

.input-wrap input::placeholder{
    color:rgba(148,163,184,.4);
    font-size:14px;
}

.input-wrap input:focus{
    border-color:rgba(96,165,250,.6);
    background:rgba(255,255,255,.10);
    box-shadow:0 0 0 3px rgba(59,130,246,.15);
}

/* strength indicator — only on new password */
.strength-bar{
    display:flex;
    gap:5px;
    margin-top:10px;
}

.strength-bar span{
    flex:1;
    height:3px;
    border-radius:3px;
    background:rgba(255,255,255,.10);
    transition:background .3s;
}

.strength-label{
    margin-top:6px;
    font-size:11px;
    font-family:'JetBrains Mono',monospace;
    color:#64748b;
    transition:color .3s;
}

/* toggle eye button */
.eye-btn{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    padding:4px;
    color:#64748b;
    transition:color .2s;
    display:flex;
    align-items:center;
}

.eye-btn:hover{ color:#94a3b8; }

.eye-btn svg{
    width:18px;
    height:18px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* DIVIDER */
.divider{
    height:1px;
    background:rgba(255,255,255,.08);
    margin:28px 0;
}

/* BUTTONS */
.btn-row{
    display:flex;
    gap:14px;
}

.btn{
    flex:1;
    padding:15px 10px;
    border:none;
    border-radius:14px;
    font-family:'Sora',sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:transform .25s, box-shadow .25s, opacity .25s;
    letter-spacing:.01em;
}

.btn:hover{
    transform:translateY(-3px);
}

.btn:active{
    transform:translateY(0);
}

.btn-submit{
    background:linear-gradient(135deg,#2563eb,#9333ea);
    color:#fff;
    box-shadow:0 6px 20px rgba(99,102,241,.35);
}

.btn-submit:hover{
    box-shadow:0 10px 28px rgba(99,102,241,.5);
}

.btn-reset{
    background:rgba(255,255,255,.08);
    color:#94a3b8;
    border:1px solid rgba(255,255,255,.10);
}

.btn-reset:hover{
    background:rgba(255,255,255,.13);
    color:#cbd5e1;
}

/* back link */
.back-link{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#64748b;
    font-size:13px;
    text-decoration:none;
    transition:color .2s;
}

.back-link:hover{ color:#94a3b8; }

/* RESPONSIVE */
@media(max-width:520px){
    .pw-card{ padding:36px 24px 32px; }
    .pw-title{ font-size:22px; }
}

</style>

<div class="password-section">

    <div class="blob-mid"></div>

    <div class="pw-card">

        <!-- Lock icon -->
        <div class="pw-icon-wrap">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <h1 class="pw-title">Change Password</h1>
        <p class="pw-subtitle">Keep your account secure with a strong,<br>unique password.</p>

        <form method="post" action="">
            {% csrf_token %}

            <!-- Old Password -->
            <div class="field">
                <label for="id_old">Current Password</label>
                <div class="input-wrap">
                    <input type="password" id="id_old" name="txt_password"
                           placeholder="Enter current password" required>
                    <button type="button" class="eye-btn" onclick="toggleEye(this,'id_old')" aria-label="Show password">
                        <svg class="eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>

            <!-- New Password -->
            <div class="field">
                <label for="id_new">New Password</label>
                <div class="input-wrap">
                    <input type="password" id="id_new" name="txt_newpassword"
                           placeholder="Min 8 chars, upper, lower & number"
                           pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                           title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"
                           required
                           oninput="checkStrength(this)">
                    <button type="button" class="eye-btn" onclick="toggleEye(this,'id_new')" aria-label="Show password">
                        <svg class="eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
                <div class="strength-bar">
                    <span id="s1"></span>
                    <span id="s2"></span>
                    <span id="s3"></span>
                    <span id="s4"></span>
                </div>
                <div class="strength-label" id="slabel">Password strength</div>
            </div>

            <!-- Retype Password -->
            <div class="field">
                <label for="id_retype">Confirm New Password</label>
                <div class="input-wrap">
                    <input type="password" id="id_retype" name="txt_retypepassword"
                           placeholder="Re-enter new password" required
                           oninput="checkMatch()">
                    <button type="button" class="eye-btn" onclick="toggleEye(this,'id_retype')" aria-label="Show password">
                        <svg class="eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
                <div class="strength-label" id="matchlabel"></div>
            </div>

            <div class="divider"></div>

            <div class="btn-row">
                <button type="reset" class="btn btn-reset" name="btn_reset">Reset</button>
                <button type="submit" class="btn btn-submit" name="btn_submit">Update Password</button>
            </div>

        </form>

        <a href="{% url 'User:MyProfile' %}" class="back-link">← Back to Profile</a>

    </div>

</div>

{% if msg %}
<script>
    alert("{{msg}}")
    window.location="{% url 'User:MyProfile' %}"
</script>
{% endif %}

<script>
function toggleEye(btn, inputId){
    const inp = document.getElementById(inputId);
    const open = btn.querySelector('.eye-open');
    const closed = btn.querySelector('.eye-closed');
    if(inp.type === 'password'){
        inp.type = 'text';
        open.style.display = 'none';
        closed.style.display = 'block';
    } else {
        inp.type = 'password';
        open.style.display = 'block';
        closed.style.display = 'none';
    }
}

const colours = {
    weak:   '#ef4444',
    fair:   '#f97316',
    good:   '#eab308',
    strong: '#22c55e'
};

function checkStrength(inp){
    const val = inp.value;
    let score = 0;
    if(val.length >= 8)            score++;
    if(/[A-Z]/.test(val))          score++;
    if(/[0-9]/.test(val))          score++;
    if(/[^A-Za-z0-9]/.test(val))   score++;

    const bars  = [s1,s2,s3,s4];
    const labels = ['','Weak','Fair','Good','Strong'];
    const cols   = ['','#ef4444','#f97316','#eab308','#22c55e'];

    bars.forEach((b,i)=>{
        b.style.background = i < score ? cols[score] : 'rgba(255,255,255,.10)';
    });

    slabel.textContent  = val.length ? labels[score] : 'Password strength';
    slabel.style.color  = val.length ? cols[score]   : '#64748b';
}

function checkMatch(){
    const np = document.getElementById('id_new').value;
    const rp = document.getElementById('id_retype').value;
    const lbl = document.getElementById('matchlabel');
    if(!rp){ lbl.textContent=''; return; }
    if(np === rp){
        lbl.textContent = '✓ Passwords match';
        lbl.style.color = '#22c55e';
    } else {
        lbl.textContent = '✗ Passwords do not match';
        lbl.style.color = '#ef4444';
    }
}
</script>

{% endblock content %}

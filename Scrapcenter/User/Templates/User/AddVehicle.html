{% extends 'Guest/nav.html' %}
{% block content %}
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{ margin:0; padding:0; box-sizing:border-box; }

body{
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#020617,#0f172a,#111827);
    overflow-x: hidden;
    color: white;
}

.vr-section{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 15px;
    position: relative;
    overflow: hidden;
}

.vr-section::before{
    content: "";
    position: absolute;
    width: 420px; height: 420px;
    background: rgba(37,99,235,0.35);
    border-radius: 50%;
    top: -120px; left: -120px;
    filter: blur(120px);
}

.vr-section::after{
    content: "";
    position: absolute;
    width: 350px; height: 350px;
    background: rgba(168,85,247,0.28);
    border-radius: 50%;
    bottom: -100px; right: -100px;
    filter: blur(120px);
}

.vr-card{
    width: 100%;
    max-width: 560px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(16px);
    border-radius: 26px;
    padding: 45px 38px;
    position: relative;
    z-index: 1;
    box-shadow: 0 20px 45px rgba(0,0,0,0.4);
    animation: fadeIn 0.7s ease;
}

@keyframes fadeIn{
    from{ opacity:0; transform:translateY(25px); }
    to{ opacity:1; transform:translateY(0); }
}

.vr-icon{
    width: 68px; height: 68px;
    border-radius: 50%;
    background: linear-gradient(135deg,#2563eb,#3b82f6);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    box-shadow: 0 8px 20px rgba(59,130,246,0.35);
}

.vr-title{
    text-align: center;
    margin-bottom: 32px;
}

.vr-title h2{ font-size: 30px; font-weight: 700; margin-bottom: 6px; }
.vr-title p{ color: rgba(255,255,255,0.65); font-size: 14px; }

/* SECTION LABELS */
.section-label{
    font-size: 11px;
    font-weight: 600;
    color: #60a5fa;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 24px 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.section-label::after{
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.08);
}

.form-group{ margin-bottom: 18px; }

.form-group label{
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
}

.form-group label i{ margin-right: 7px; font-size: 15px; color: #60a5fa; }

.form-control{
    width: 100%;
    height: 52px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.05);
    color: #fff;
    padding: 0 16px;
    font-size: 14px;
    font-family: 'Poppins', sans-serif;
    transition: all 0.3s ease;
}

.form-control::placeholder{ color: rgba(255,255,255,0.4); }

.form-control:focus{
    outline: none;
    border-color: #3b82f6;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 18px rgba(59,130,246,0.3);
}

select.form-control option{ background: #0f172a; color: #fff; }

textarea.form-control{
    height: 90px;
    padding: 12px 16px;
    resize: vertical;
}

.row-2{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

/* RADIO BUTTONS */
.radio-group{ display: flex; gap: 12px; flex-wrap: wrap; }

.radio-btn{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.04);
    cursor: pointer;
    transition: all 0.25s;
    font-size: 13px;
    color: rgba(255,255,255,0.75);
}

.radio-btn input{ accent-color: #3b82f6; width: 15px; height: 15px; }

.radio-btn:hover{
    border-color: #3b82f6;
    background: rgba(59,130,246,0.08);
}

/* FILE UPLOAD */
.file-label{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px dashed rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.04);
    cursor: pointer;
    transition: all 0.3s;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
}

.file-label:hover{
    border-color: #3b82f6;
    background: rgba(59,130,246,0.08);
}

.file-label i{ font-size: 22px; color: #60a5fa; }
.file-label input{ display: none; }

.divider{
    border: none;
    border-top: 1px solid rgba(255,255,255,0.08);
    margin: 24px 0;
}

.btn-row{ display: flex; gap: 12px; }

.btn-add{
    flex: 1;
    height: 52px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg,#2563eb,#3b82f6);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-add:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 24px rgba(37,99,235,0.45);
}

.btn-cancel{
    flex: 1;
    height: 52px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.8);
    font-size: 15px;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-cancel:hover{
    background: rgba(255,255,255,0.10);
    transform: translateY(-3px);
}

@media(max-width:576px){
    .vr-card{ padding: 35px 22px; }
    .vr-title h2{ font-size: 24px; }
    .row-2{ grid-template-columns: 1fr; }
}
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<section class="vr-section">
    <div class="vr-card">

        <div class="vr-title">
            <div class="vr-icon">
                <i class="ti ti-car" style="color:#fff; font-size:28px;"></i>
            </div>
            <h2>Vehicle Registration</h2>
            <p>Fill in the details to list your vehicle</p>
        </div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- BASIC INFO -->
            <div class="section-label">
                <i class="ti ti-info-circle" style="font-size:14px;"></i> Basic Info
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label><i class="ti ti-calendar"></i>Year of Manufacture</label>
                    <input type="text" class="form-control" name="txtno"
                           placeholder="e.g. 2018" required>
                </div>
                <div class="form-group">
                    <label><i class="ti ti-gauge"></i>Mileage (km)</label>
                    <input type="number" class="form-control" name="txtmile"
                           placeholder="e.g. 45000" required>
                </div>
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label><i class="ti ti-flame"></i>Fuel Type</label>
                    <input type="text" class="form-control" name="txtfuel"
                           placeholder="Petrol / Diesel / EV" required>
                </div>
                <div class="form-group">
                    <label><i class="ti ti-settings"></i>Transmission</label>
                    <input type="text" class="form-control" name="txtgear"
                           placeholder="Manual / Automatic" required>
                </div>
            </div>

            <div class="form-group">
                <label><i class="ti ti-star"></i>Condition</label>
                <input type="text" class="form-control" name="txtcond"
                       placeholder="Good / Fair / Poor" required>
            </div>

            <!-- DOCUMENTS -->
            <div class="section-label">
                <i class="ti ti-file-certificate" style="font-size:14px;"></i> Documents
            </div>

            <div class="form-group">
                <label><i class="ti ti-id"></i>RC Available</label>
                <div class="radio-group">
                    <label class="radio-btn">
                        <input type="radio" name="rc" value="YES" required> YES
                    </label>
                    <label class="radio-btn">
                        <input type="radio" name="rc" value="NO"> NO
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label><i class="ti ti-shield"></i>Insurance Available</label>
                <div class="radio-group">
                    <label class="radio-btn">
                        <input type="radio" name="Ins" value="YES" required> YES
                    </label>
                    <label class="radio-btn">
                        <input type="radio" name="Ins" value="NO"> NO
                    </label>
                </div>
            </div>

            <!-- BRAND & LOCATION -->
            <div class="section-label">
                <i class="ti ti-map-pin" style="font-size:14px;"></i> Brand & Location
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label><i class="ti ti-brand-apple"></i>Brand</label>
                    <select class="form-control" name="sel_brand" id="sel_brand" required>
                        <option value="">-- Select Brand --</option>
                        {% for i in brand %}
                        <option value="{{ i.id }}">{{ i.brand_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="ti ti-car"></i>Model</label>
                    <select class="form-control" name="sel_model" id="sel_model" required>
                        <option value="">-- Select Model --</option>
                    </select>
                </div>
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label><i class="ti ti-map"></i>District</label>
                    <select class="form-control" name="sel_qus" id="sel_district" required>
                        <option value="">-- Select District --</option>
                        {% for i in district %}
                        <option value="{{ i.id }}">{{ i.district_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="ti ti-map-pin"></i>Place</label>
                    <select class="form-control" name="sel_place" id="sel_place" required>
                        <option value="">-- Select Place --</option>
                    </select>
                </div>
            </div>

            <!-- STATUS & DESCRIPTION -->
            <div class="section-label">
                <i class="ti ti-list-details" style="font-size:14px;"></i> Status & Description
            </div>

            <div class="form-group">
                <label><i class="ti ti-activity"></i>Vehicle Status</label>
                <div class="radio-group">
                    <label class="radio-btn">
                        <input type="radio" name="Status" value="Running" required> Running
                    </label>
                    <label class="radio-btn">
                        <input type="radio" name="Status" value="Totaled"> Totaled
                    </label>
                    <label class="radio-btn">
                        <input type="radio" name="Status" value="Scrap"> Scrap
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label><i class="ti ti-message"></i>Description</label>
                <textarea class="form-control" name="txtdiscription"
                          placeholder="Describe the vehicle condition, history, etc." required></textarea>
            </div>

            <!-- PHOTO -->
            <div class="section-label">
                <i class="ti ti-photo" style="font-size:14px;"></i> Photo
            </div>

            <div class="form-group">
                <label class="file-label" for="txt_file">
                    <i class="ti ti-upload"></i>
                    <span id="file-text">Click to upload vehicle photo</span>
                    <input type="file" id="txt_file" name="txt_file" accept="image/*">
                </label>
            </div>

            <hr class="divider">

            <div class="btn-row">
                <button type="submit" name="btnsubmit" class="btn-add">
                    <i class="ti ti-circle-plus"></i> Add Vehicle
                </button>
                <button type="reset" name="btnreset" class="btn-cancel">
                    <i class="ti ti-x"></i> Cancel
                </button>
            </div>
        </form>
    </div>
</section>
      

<!-- FILE NAME PREVIEW -->
<script>
document.getElementById('txt_file').addEventListener('change', function(){
    const name = this.files[0] ? this.files[0].name : 'Click to upload vehicle photo';
    document.getElementById('file-text').textContent = name;
});
</script>

<!-- AJAX FOR BRAND → MODEL & DISTRICT → PLACE -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
$('#sel_brand').change(function(){
    var did = $(this).val();
    var ur = "{% url 'User:ajaxmodel' %}";
    $.ajax({
        url: ur,
        data: { did: did },
        success: function(data){
            $('#sel_model').html(data);
        }
    });
});

$('#sel_district').change(function(){
    var did = $(this).val();
    var ur = "{% url 'Guest:ajaxplace' %}";
    $.ajax({
        url: ur,
        data: { did: did },
        success: function(data){
            $('#sel_place').html(data);
        }
    });
});
</script>

{% if msg %}
<script>
    alert("{{ msg }}")
    window.location = "{% url 'User:AddVehicle' %}"
</script>
{% endif %}

{% endblock content %}

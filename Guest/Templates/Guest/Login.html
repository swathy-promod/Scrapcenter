{% extends 'Guest/footer.html' %}
{% block content %}
<style>

/* ================= GOOGLE FONT ================= */

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ================= BODY ================= */

body{
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#020617,#0f172a,#111827);
    overflow-x: hidden;
    color: white;
}

/* ================= NAVBAR ================= */

.custom-navbar{
    width: 100%;
    padding: 18px 70px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 999;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.logo{
    font-size: 34px;
    font-weight: 700;
    color: #ffffff;
    text-decoration: none;
}

.logo span{
    color: #3b82f6;
}

.nav-links{
    display: flex;
    gap: 35px;
    align-items: center;
}

.nav-links a{
    text-decoration: none;
    color: rgba(255,255,255,0.8);
    font-size: 15px;
    font-weight: 500;
    transition: 0.3s;
    position: relative;
}

.nav-links a:hover{
    color: #60a5fa;
}

.nav-links a::after{
    content: '';
    position: absolute;
    width: 0%;
    height: 2px;
    background: #3b82f6;
    left: 0;
    bottom: -6px;
    transition: 0.3s;
}

.nav-links a:hover::after{
    width: 100%;
}

/* ACTIVE MENU */

.nav-active{
    background: linear-gradient(135deg,#2563eb,#3b82f6);
    padding: 12px 28px;
    border-radius: 14px;
    color: white !important;
    box-shadow: 0 10px 20px rgba(59,130,246,0.35);
}

/* ================= MAIN LOGIN SECTION ================= */

.login-section{
    min-height: 88vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 15px;
    position: relative;
    overflow: hidden;
}

/* BACKGROUND GLOW */

.login-section::before{
    content: "";
    position: absolute;
    width: 420px;
    height: 420px;
    background: rgba(37,99,235,0.35);
    border-radius: 50%;
    top: -120px;
    left: -120px;
    filter: blur(120px);
}

.login-section::after{
    content: "";
    position: absolute;
    width: 350px;
    height: 350px;
    background: rgba(168,85,247,0.28);
    border-radius: 50%;
    bottom: -100px;
    right: -100px;
    filter: blur(120px);
}

/* ================= LOGIN CARD ================= */

.login-card{
    width: 100%;
    max-width: 450px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(16px);
    border-radius: 26px;
    padding: 45px 38px;
    position: relative;
    z-index: 1;
    box-shadow: 0 20px 45px rgba(0,0,0,0.4);
    animation: fadeIn 0.7s ease;
}

@keyframes fadeIn{
    from{
        opacity: 0;
        transform: translateY(25px);
    }
    to{
        opacity: 1;
        transform: translateY(0);
    }
}

/* ================= LOGIN TITLE ================= */

.login-title{
    text-align: center;
    margin-bottom: 35px;
}

.login-title h2{
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 8px;
}

.login-title p{
    color: rgba(255,255,255,0.65);
    font-size: 14px;
}

/* ================= FORM ================= */

.form-group{
    margin-bottom: 22px;
}

.form-group label{
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 500;
    color: #fff;
}

.form-control{
    width: 100%;
    height: 55px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.05);
    color: #fff;
    padding: 0 16px;
    font-size: 15px;
    transition: all 0.3s ease;
}

.form-control::placeholder{
    color: rgba(255,255,255,0.45);
}

.form-control:focus{
    outline: none;
    border-color: #3b82f6;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 18px rgba(59,130,246,0.35);
}

/* ================= BUTTON ================= */

.btn-login{
    width: 100%;
    height: 55px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg,#2563eb,#3b82f6);
    color: white;
    font-size: 16px;
    font-weight: 600;
    margin-top: 10px;
    transition: all 0.3s ease;
    cursor: pointer;
}

.btn-login:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 24px rgba(37,99,235,0.45);
}

/* ================= FOOTER TEXT ================= */

.login-footer{
    text-align: center;
    margin-top: 20px;
    color: rgba(255,255,255,0.7);
    font-size: 14px;
}

.login-footer a{
    color: #60a5fa;
    text-decoration: none;
    font-weight: 600;
}

.login-footer a:hover{
    color: #93c5fd;
}

/* ================= MAIN FOOTER ================= */

.main-footer{
    width: 100%;
    background: rgba(255,255,255,0.04);
    border-top: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    padding-top: 60px;
}

.footer-container{
    width: 90%;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 40px;
    padding-bottom: 40px;
}

.footer-box h3{
    margin-bottom: 18px;
    font-size: 22px;
    font-weight: 600;
}

.footer-box p{
    color: rgba(255,255,255,0.7);
    line-height: 1.8;
    font-size: 14px;
}

.footer-links{
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.footer-links a{
    text-decoration: none;
    color: rgba(255,255,255,0.75);
    transition: 0.3s;
    font-size: 14px;
}

.footer-links a:hover{
    color: #60a5fa;
    transform: translateX(5px);
}

.footer-bottom{
    border-top: 1px solid rgba(255,255,255,0.08);
    text-align: center;
    padding: 18px;
    color: rgba(255,255,255,0.65);
    font-size: 14px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:992px){

    .custom-navbar{
        padding: 18px 25px;
        flex-direction: column;
        gap: 20px;
    }

    .nav-links{
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
    }
}

@media(max-width:576px){

    .login-card{
        padding: 35px 25px;
    }

    .login-title h2{
        font-size: 28px;
    }

    .logo{
        font-size: 28px;
    }
}

</style>

<!-- ================= NAVBAR ================= -->

<!-- ================= LOGIN SECTION ================= -->

<section class="login-section">

    <div class="login-card">

        <div class="login-title">
            <h2>Welcome Back</h2>
            <p>Login to continue your journey</p>
        </div>

        <form method="post">

            {% csrf_token %}

            <!-- EMAIL -->

            <div class="form-group">

                <label>Email Address</label>

                <input type="email"
                       name="txt_Email"
                       class="form-control"
                       placeholder="Enter your email"
                       required>

            </div>

            <!-- PASSWORD -->

            <div class="form-group">

                <label>Password</label>

                <input type="password"
                       name="pswd_password"
                       class="form-control"
                       placeholder="Enter your password"
                       required>

            </div>

            <!-- BUTTON -->

            <button type="submit" class="btn-login">
                Login
            </button>

        </form>
          <div class="login-footer">

            forgot your password?

            <a href="{% url 'Guest:forgotpassword' %}">
                Click Here
            </a>


        <div class="login-footer">

            Don’t have an account?

            <a href="{% url 'Guest:userregistration' %}">
                New User Register Here
            </a>
            <div class="login-footer">

            Register Your Company?

            <a href="{% url 'Guest:ScrapcenterReg' %}">
                 Register Here
            </a>

        </div>

    </div>

</section>



{% if msg %}
<script>
    alert("{{ msg }}");
    window.location = "{% url 'Guest:Login' %}";
</script>
{% endif %}
{% endblock content %}

{% extends 'Guest/footer.html' %}
{% block content %}

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#020617,#0f172a,#111827);
    overflow-x:hidden;
    color:white;
}

/* ── SECTION ── */

.otp-section{
    min-height:88vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 15px;
    position:relative;
    overflow:hidden;
}

.otp-section::before{
    content:'';
    position:absolute;
    width:420px;
    height:420px;
    background:rgba(37,99,235,.35);
    border-radius:50%;
    top:-120px;
    left:-120px;
    filter:blur(120px);
}

.otp-section::after{
    content:'';
    position:absolute;
    width:350px;
    height:350px;
    background:rgba(168,85,247,.28);
    border-radius:50%;
    bottom:-100px;
    right:-100px;
    filter:blur(120px);
}

/* ── CARD ── */

.otp-card{
    width:100%;
    max-width:450px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);
    backdrop-filter:blur(16px);
    border-radius:26px;
    padding:45px 38px;
    position:relative;
    z-index:1;
    box-shadow:0 20px 45px rgba(0,0,0,.4);
    animation:fadeIn .7s ease;
}

@keyframes fadeIn{
    from{ opacity:0; transform:translateY(25px); }
    to{   opacity:1; transform:translateY(0);    }
}

/* ── ICON ── */

.card-icon{
    width:72px;
    height:72px;
    border-radius:22px;
    background:linear-gradient(135deg,#2563eb,#9333ea);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 28px;
    box-shadow:0 8px 24px rgba(99,102,241,.4);
}

.card-icon svg{
    width:34px;
    height:34px;
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* ── TITLE ── */

.card-title{
    text-align:center;
    margin-bottom:32px;
}

.card-title h2{
    font-size:30px;
    font-weight:700;
    margin-bottom:8px;
}

.card-title p{
    color:rgba(255,255,255,.60);
    font-size:14px;
    line-height:1.6;
}

/* ── STEPS ── */

.steps{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:32px;
}

.step{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
}

.step-circle{
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:600;
}

.step-done .step-circle{
    background:rgba(34,197,94,.15);
    border:1px solid rgba(34,197,94,.35);
    color:#4ade80;
}

.step-active .step-circle{
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
    box-shadow:0 4px 12px rgba(59,130,246,.4);
}

.step-inactive .step-circle{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    color:rgba(255,255,255,.35);
}

.step-label{
    font-size:10px;
    font-weight:500;
    white-space:nowrap;
}

.step-done   .step-label{ color:#4ade80; }
.step-active .step-label{ color:#60a5fa; }
.step-inactive .step-label{ color:rgba(255,255,255,.30); }

.step-line{
    width:40px;
    height:1px;
    margin-bottom:16px;
}

.step-line-done{ background:rgba(34,197,94,.3); }
.step-line-inactive{ background:rgba(255,255,255,.12); }

/* ── OTP BOXES ── */

.otp-label{
    display:block;
    text-align:center;
    font-size:14px;
    font-weight:500;
    color:#fff;
    margin-bottom:18px;
}

.otp-boxes{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:10px;
}

.otp-box{
    width:56px;
    height:64px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05);
    color:#fff;
    font-size:26px;
    font-weight:700;
    text-align:center;
    caret-color:transparent;
    outline:none;
    transition:all .25s ease;
    font-family:'Poppins',sans-serif;
    /* hide number spinners */
    -moz-appearance:textfield;
}

.otp-box::-webkit-outer-spin-button,
.otp-box::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
}

.otp-box:focus{
    border-color:#3b82f6;
    background:rgba(59,130,246,.10);
    box-shadow:0 0 18px rgba(59,130,246,.30);
    transform:translateY(-3px);
}

.otp-box.filled{
    border-color:rgba(96,165,250,.4);
    background:rgba(59,130,246,.08);
}

/* hidden real input for form submission */
#otp-hidden{
    display:none;
}

/* ── TIMER ── */

.otp-timer{
    text-align:center;
    font-size:13px;
    color:rgba(255,255,255,.45);
    margin-top:14px;
    margin-bottom:6px;
    min-height:20px;
}

.otp-timer span{
    color:#60a5fa;
    font-weight:600;
}

.resend-link{
    display:block;
    text-align:center;
    font-size:13px;
    color:rgba(255,255,255,.35);
    margin-bottom:24px;
    cursor:default;
    transition:.3s;
}

.resend-link.active{
    color:#60a5fa;
    cursor:pointer;
    text-decoration:underline;
}

/* ── BUTTON ── */

.btn-verify{
    width:100%;
    height:55px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
    font-size:16px;
    font-weight:600;
    font-family:'Poppins',sans-serif;
    cursor:pointer;
    transition:all .3s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.btn-verify svg{
    width:18px;
    height:18px;
    stroke:white;
    fill:none;
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.btn-verify:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 24px rgba(37,99,235,.45);
}

.btn-verify:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
}

/* ── DIVIDER ── */

.divider{
    height:1px;
    background:rgba(255,255,255,.08);
    margin:24px 0;
}

/* ── FOOTER ── */

.card-footer{
    text-align:center;
    color:rgba(255,255,255,.65);
    font-size:14px;
}

.card-footer a{
    color:#60a5fa;
    text-decoration:none;
    font-weight:600;
    transition:color .2s;
}

.card-footer a:hover{ color:#93c5fd; }

/* ── RESPONSIVE ── */

@media(max-width:480px){
    .otp-card{ padding:35px 22px; }
    .card-title h2{ font-size:24px; }
    .otp-box{ width:44px; height:54px; font-size:22px; }
    .otp-boxes{ gap:8px; }
}

</style>

<section class="otp-section">

    <div class="otp-card">

        <!-- Icon -->
        <div class="card-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
        </div>

        <!-- Title -->
        <div class="card-title">
            <h2>Verify OTP</h2>
            <p>Enter the one-time password sent<br>to your registered email address.</p>
        </div>

        <!-- Steps — OTP is step 2 -->
        <div class="steps">
            <div class="step step-done">
                <div class="step-circle">✓</div>
                <span class="step-label">Email</span>
            </div>
            <div class="step-line step-line-done"></div>
            <div class="step step-active">
                <div class="step-circle">2</div>
                <span class="step-label">OTP</span>
            </div>
            <div class="step-line step-line-inactive"></div>
            <div class="step step-inactive">
                <div class="step-circle">3</div>
                <span class="step-label">Reset</span>
            </div>
        </div>

        <!-- Form -->
        <form action="" method="post" id="otp-form">
            {% csrf_token %}

            <!-- Hidden input that actually gets submitted -->
            <input type="text" name="txt_otp" id="otp-hidden">

            <label class="otp-label">Enter 6-digit OTP</label>

            <!-- Visual OTP boxes -->
            <div class="otp-boxes">
                <input class="otp-box" type="number" maxlength="1" min="0" max="9" inputmode="numeric">
                <input class="otp-box" type="number" maxlength="1" min="0" max="9" inputmode="numeric">
                <input class="otp-box" type="number" maxlength="1" min="0" max="9" inputmode="numeric">
                <input class="otp-box" type="number" maxlength="1" min="0" max="9" inputmode="numeric">
                <input class="otp-box" type="number" maxlength="1" min="0" max="9" inputmode="numeric">
                <input class="otp-box" type="number" maxlength="1" min="0" max="9" inputmode="numeric">
            </div>

            <!-- Timer -->
            <div class="otp-timer" id="timer-text">OTP expires in <span id="countdown">02:00</span></div>
            <span class="resend-link" id="resend-btn">Resend OTP</span>

            <button type="submit" class="btn-verify" id="verify-btn">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                Verify OTP
            </button>

        </form>

        <div class="divider"></div>

        <div class="card-footer">
            <a href="{% url 'Guest:forgotpassword' %}">← Back to Forgot Password</a>
        </div>

    </div>

</section>

{% if msg %}
<script>
    alert("{{ msg }}")
</script>
{% endif %}

<script>
/* ── OTP BOX LOGIC ── */
const boxes   = document.querySelectorAll('.otp-box');
const hidden  = document.getElementById('otp-hidden');
const form    = document.getElementById('otp-form');

boxes.forEach((box, idx) => {

    box.addEventListener('input', () => {
        // keep only last digit
        if(box.value.length > 1) box.value = box.value.slice(-1);

        if(box.value){ 
            box.classList.add('filled');
            if(idx < boxes.length - 1) boxes[idx + 1].focus();
        } else {
            box.classList.remove('filled');
        }
        syncHidden();
    });

    box.addEventListener('keydown', e => {
        if(e.key === 'Backspace' && !box.value && idx > 0){
            boxes[idx - 1].focus();
            boxes[idx - 1].value = '';
            boxes[idx - 1].classList.remove('filled');
            syncHidden();
        }
    });

    box.addEventListener('paste', e => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text').trim();
        if(/^\d{6}$/.test(text)){
            boxes.forEach((b, i) => {
                b.value = text[i] || '';
                b.classList.toggle('filled', !!b.value);
            });
            boxes[5].focus();
            syncHidden();
        }
    });
});

function syncHidden(){
    hidden.value = Array.from(boxes).map(b => b.value).join('');
}

/* ── COUNTDOWN TIMER ── */
let seconds = 120;
const countdownEl = document.getElementById('countdown');
const timerText   = document.getElementById('timer-text');
const resendBtn   = document.getElementById('resend-btn');

const timer = setInterval(() => {
    seconds--;
    const m = String(Math.floor(seconds / 60)).padStart(2,'0');
    const s = String(seconds % 60).padStart(2,'0');
    countdownEl.textContent = `${m}:${s}`;

    if(seconds <= 0){
        clearInterval(timer);
        timerText.textContent = 'OTP has expired.';
        resendBtn.classList.add('active');
    }
}, 1000);

resendBtn.addEventListener('click', () => {
    if(resendBtn.classList.contains('active')){
        window.location = "{% url 'Guest:forgotpassword' %}";
    }
});
</script>

{% endblock content %}

{% extends 'Administrator/HomePage.html' %}
{% load static %}
{% block content %}
<div class="row">
  <div class="col-md-6 offset-md-3 grid-margin stretch-card">
    <div class="card">
      <div class="card-body">

        <h4 class="card-title">Change Password</h4>
        <p class="card-description">Update your admin password</p>

        {% if msg %}
          <div class="alert alert-{{ msg_type }} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
        {% endif %}

        <form method="POST" action="{% url 'Administrator:ChangePassword' %}">
          {% csrf_token %}

          <div class="form-group">
            <label>Old Password</label>
            <input 
              type="password" 
              name="old_password" 
              class="form-control form-control-lg" 
              placeholder="Enter old password" 
              required
              autocomplete="current-password">
          </div>

          <div class="form-group">
            <label>New Password</label>
            <input 
              type="password" 
              name="new_password" 
              class="form-control form-control-lg" 
              placeholder="Enter new password"
              minlength="6" 
              required
              autocomplete="new-password">
            <small class="form-text text-muted">Minimum 6 characters.</small>
          </div>

          <div class="form-group">
            <label>Confirm New Password</label>
            <input 
              type="password" 
              name="confirm_password" 
              class="form-control form-control-lg" 
              placeholder="Confirm new password"
              minlength="6" 
              required
              autocomplete="new-password">
          </div>

          <div class="mt-4">
            <button type="submit" class="btn btn-primary mr-2">Change Password</button>
            <a href="{% url 'Administrator:HomePage' %}" class="btn btn-light">Cancel</a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

<!-- Client-side password match validation -->
<script>
  document.querySelector('form').addEventListener('submit', function(e) {
    const newPass     = document.querySelector('input[name="new_password"]').value;
    const confirmPass = document.querySelector('input[name="confirm_password"]').value;
    if (newPass !== confirmPass) {
      e.preventDefault();
      alert('New password and confirm password do not match.');
    }
  });
</script>
{% endblock content %}
